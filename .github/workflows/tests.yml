name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: harvesta_testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: harvesta_testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and unit tests
        run: mvn -B verify

      - name: Start the app (creates schema and demo data)
        run: |
          mvn -B -q jetty:run > jetty.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://localhost:8080/login > /dev/null && exit 0; sleep 2; done
          cat jetty.log; exit 1

      - name: Smoke test every page and role
        run: bash scripts/smoke.sh

      - name: Server log
        if: failure()
        run: cat jetty.log
